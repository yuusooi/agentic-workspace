    url: jdbc:mysql://localhost:3306/taskboard?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: TaskBoardHikariCP

  data:
    redis:
      host: 192.168.195.132
      port: 6379
      password:
      database: 0
      timeout: 5000ms
